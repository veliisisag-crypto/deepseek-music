<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Welly Player v17.4</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:15px;padding-bottom:140px;min-height:100vh}
        .container{max-width:500px;margin:0 auto}
        
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-bottom:15px;border-bottom:1px solid #222}
        .version{background:#ff0000;color:#fff;padding:6px 14px;border-radius:15px;font-weight:bold;font-size:12px}
        .top-title{color:#888;font-size:13px}
        
        .box{background:#1a1a1a;border-radius:15px;padding:18px;margin-bottom:15px;border:1px solid #222}
        
        /* PLAYER - STICKY */
        .player-box{
            display:none;
            position:sticky;
            top:10px;
            z-index:100;
            background:#1a1a1a;
            box-shadow:0 5px 20px rgba(0,0,0,0.5);
        }
        
        .search-row{display:flex;gap:8px;margin-bottom:8px}
        .search-row input{flex:1;padding:14px 16px;border:2px solid #333;border-radius:25px;background:#111;color:#fff;font-size:15px;-webkit-appearance:none;min-width:0}
        .search-row input:focus{outline:none;border-color:#ff0000}
        
        .btn{height:50px;border-radius:25px;border:none;font-weight:bold;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px}
        .btn:active{transform:scale(0.95)}
        .btn-yt{background:#ff0000;color:#fff;flex:1;font-size:14px}
        .btn-local{background:#0066ff;color:#fff;flex:1;font-size:14px}
        .btn-mic{width:50px;height:50px;border-radius:50%;background:#333;color:#fff;font-size:20px;flex-shrink:0;padding:0}
        .btn-mic.listening{background:#ff0000;animation:pulse 1.2s infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,0,0.5)}50%{box-shadow:0 0 0 15px rgba(255,0,0,0)}}
        .btn-folder{background:#222;color:#fff;border:1px dashed #555;font-size:12px;padding:8px 14px;border-radius:20px;cursor:pointer;width:100%;margin-top:8px}
        
        .status-bar{text-align:center;font-size:12px;color:#888;min-height:18px;margin:5px 0}
        
        .results-box{max-height:350px;overflow-y:auto}
        .results-box::-webkit-scrollbar{width:3px}
        .results-box::-webkit-scrollbar-track{background:#111}
        .results-box::-webkit-scrollbar-thumb{background:#ff0000;border-radius:2px}
        
        .results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #333;font-size:13px}
        .btn-close{background:none;border:1px solid #555;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px}
        
        .result-item{display:flex;align-items:center;gap:10px;padding:10px;background:#222;border-radius:10px;margin:4px 0;cursor:pointer;border-left:3px solid transparent}
        .result-item.youtube{border-left-color:#ff0000}
        .result-item.local{border-left-color:#0066ff}
        .result-item.playing{background:#1a2a1a!important;border-left-color:#00ff00!important}
        .result-item img,.result-icon{width:42px;height:42px;border-radius:6px;flex-shrink:0;object-fit:cover;background:#333}
        .result-icon{display:flex;align-items:center;justify-content:center;font-size:22px}
        .result-info{flex:1;min-width:0}
        .result-info strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .result-info small{color:#888;font-size:10px}
        .badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:bold}
        .badge-yt{background:#ff0000;color:#fff}
        .badge-local{background:#0066ff;color:#fff}
        
        #thumbnail{width:100%;border-radius:12px;margin-bottom:12px;max-height:180px;object-fit:cover;background:#222;display:none}
        #thumbnail[src]:not([src=""]):not([src="#"]){display:block}
        #title{font-size:1.1em;margin-bottom:3px;word-break:break-word}
        #artist{color:#888;font-size:0.85em;margin-bottom:10px}
        
        .seek-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;color:#888}
        .seek-row input[type=range]{flex:1;accent-color:#ff0000;height:3px;margin:0}
        
        .controls{display:flex;gap:8px;justify-content:center;margin:12px 0}
        .controls button{width:50px;height:50px;border-radius:50%;border:none;font-size:18px;cursor:pointer;background:#333;color:#fff}
        .controls button:active{transform:scale(0.9)}
        .controls button:disabled{opacity:0.2}
        .btn-play-main{width:65px!important;height:65px!important;font-size:26px!important;background:#ff0000!important}
        
        .volume-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#222;border-radius:20px}
        .volume-row input[type=range]{flex:1;accent-color:#ff0000;height:3px}
        
        .playlist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}
        .playlist-item{display:flex;align-items:center;gap:8px;padding:10px;background:#222;border-radius:8px;margin:3px 0;cursor:pointer}
        .playlist-item.active{background:linear-gradient(135deg,#cc0000,#ff0000)}
        .playlist-item img,.playlist-item .icon{width:35px;height:35px;border-radius:5px;flex-shrink:0}
        .playlist-item .info{flex:1;min-width:0}
        .playlist-item strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .playlist-item small{color:#888;font-size:10px}
        .btn-remove{width:24px;height:24px;border-radius:50%;border:1px solid #f44;background:transparent;color:#f44;font-size:12px;cursor:pointer;flex-shrink:0;padding:0}
        
        .loading-state{text-align:center;padding:25px;color:#888}
        .spinner{width:30px;height:30px;border:3px solid #333;border-top:3px solid #ff0000;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .empty-state{text-align:center;color:#555;padding:25px;font-size:13px}
        
        #playerFrame{position:fixed;bottom:-9999px;right:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="version">🎵 v17.4</span>
        <span class="top-title">Welly Player</span>
    </div>

    <div class="container">
        <!-- PLAYER - EN ÜSTTE STICKY -->
        <div id="player" class="box player-box">
            <img id="thumbnail" src="" alt="">
            <h3 id="title">-</h3>
            <p id="artist">-</p>
            
            <div class="seek-row">
                <span id="seekTime">00:00 / 00:00</span>
                <input type="range" id="seekSlider" min="0" max="100" value="0" oninput="seekTo(this.value)">
            </div>
            
            <div class="controls">
                <button onclick="prevTrack()" id="prevBtn" disabled>⏮️</button>
                <button onclick="togglePlay()" id="playBtn" class="btn-play-main">▶️</button>
                <button onclick="nextTrack()" id="nextBtn" disabled>⏭️</button>
            </div>
            
            <div class="volume-row">
                <span>🔈</span>
                <input type="range" id="volSlider" min="0" max="100" value="70" oninput="setVolume(this.value)">
                <span>🔊</span>
            </div>
        </div>

        <!-- ARAMA -->
        <div class="box">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Şarkı ara veya link yapıştır..." autocomplete="off">
                <button onclick="startVoiceSearch()" class="btn btn-mic" id="micBtn" title="Sesli Ara">🎤</button>
            </div>
            <div class="search-row">
                <button onclick="searchYouTube()" class="btn btn-yt">🔍 YouTube'da Ara</button>
                <button onclick="searchLocal()" class="btn btn-local">📱 Telefonda Ara</button>
            </div>
            <button onclick="pickFolder()" class="btn-folder" id="folderBtn">
                📂 Klasör Seç (<span id="folderInfo">seçilmedi</span>)
            </button>
            <div class="status-bar" id="statusBar"></div>
        </div>

        <!-- SONUÇLAR -->
        <div id="resultsBox" class="box results-box" style="display:none">
            <div class="results-header">
                <span id="resultsTitle">Sonuçlar (<span id="resultCount">0</span>)</span>
                <button onclick="closeResults()" class="btn-close">✕</button>
            </div>
            <div id="resultsList"></div>
        </div>

        <!-- PLAYLIST -->
        <div class="box">
            <div class="playlist-header">
                <span>📜 Çalma Listesi (<span id="count">0</span>)</span>
                <button onclick="clearPlaylist()" style="background:transparent;border:1px solid #f44;color:#f44;padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer">Temizle</button>
            </div>
            <div id="playlist"></div>
        </div>
    </div>

    <div id="playerFrame"><div id="ytplayer"></div></div>
    <audio id="localAudio" style="display:none"></audio>
    <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none" accept="audio/*">

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js?v=17.4"></script>
</body>
</html>
