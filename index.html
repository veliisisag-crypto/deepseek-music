<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Müzik v5.0</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;padding:20px}
        .version{position:fixed;top:10px;right:10px;background:#ff0000;color:#fff;padding:8px 15px;border-radius:20px;font-weight:bold;font-size:14px;z-index:999}
        .container{max-width:500px;margin:0 auto}
        h1{text-align:center;margin:20px 0;font-size:1.8em}
        .box{background:#1a1a1a;border-radius:15px;padding:20px;margin:15px 0}
        input{width:100%;padding:15px;border:2px solid #333;border-radius:10px;background:#111;color:#fff;font-size:16px;margin:10px 0}
        input:focus{outline:none;border-color:#f00}
        button{width:100%;padding:15px;background:#f00;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin:5px 0}
        button:hover{opacity:0.9}
        button:disabled{background:#333}
        .btn-sm{width:auto;padding:10px 20px;font-size:14px}
        #status{text-align:center;color:#888;padding:10px;font-size:14px}
        #player{display:none}
        #thumbnail{width:100%;border-radius:10px;margin:10px 0;max-height:200px;object-fit:cover}
        #title{font-size:1.2em;margin:10px 0;word-break:break-word}
        #artist{color:#888}
        .controls{display:flex;gap:10px;justify-content:center;margin:15px 0}
        .playlist-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#222;border-radius:8px;margin:5px 0;cursor:pointer}
        .playlist-item.active{background:#f00}
        .hidden{display:none!important}
        #playerFrame{position:fixed;bottom:-9999px;right:-9999px;width:1px;height:1px;opacity:0}
    </style>
</head>
<body>
    <div class="version">🎵 v5.0</div>
    
    <div class="container">
        <h1>🎵 YouTube Müzik</h1>
        <p style="text-align:center;color:#888;margin-bottom:20px">Sadece Ses • Veri Tasarrufu</p>
        
        <div class="box">
            <p style="margin-bottom:10px"><strong>📋 YouTube Linki Yapıştır:</strong></p>
            <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=...">
            <button onclick="playUrl()">▶️ OYNAT</button>
            <button class="btn-sm" onclick="pasteUrl()" style="background:#333">📋 Panodan Yapıştır</button>
        </div>

        <div id="player" class="box">
            <img id="thumbnail" src="" alt="">
            <h3 id="title">-</h3>
            <p id="artist">-</p>
            <div class="controls">
                <button class="btn-sm" onclick="prevTrack()" id="prevBtn" disabled>⏮️</button>
                <button onclick="togglePlay()" id="playBtn">⏸️</button>
                <button class="btn-sm" onclick="nextTrack()" id="nextBtn" disabled>⏭️</button>
            </div>
            <div style="display:flex;align-items:center;gap:10px;margin:10px 0">
                <span>🔈</span>
                <input type="range" id="volSlider" min="0" max="100" value="70" style="flex:1" oninput="setVolume(this.value)">
                <span id="volText">70%</span>
            </div>
            <p id="status">Hazır</p>
        </div>

        <div class="box">
            <h3 style="margin-bottom:10px">📜 Çalma Listesi (<span id="count">0</span>)</h3>
            <div id="playlist"></div>
            <button class="btn-sm" onclick="clearPlaylist()" style="background:#333;margin-top:10px">🗑️ Listeyi Temizle</button>
        </div>
    </div>

    <div id="playerFrame"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ============ ANA KOD ============
        console.log('🎵 YT Music v5.0 başladı');
        
        let playlist = JSON.parse(localStorage.getItem('playlist_v5') || '[]');
        let currentIndex = -1;
        let ytPlayer = null;
        let isPlaying = false;

        // YouTube API hazır olunca
        function onYouTubeIframeAPIReady() {
            console.log('✅ YouTube API hazır');
            updateUI();
        }

        function playUrl() {
            const input = document.getElementById('urlInput');
            const url = input.value.trim();
            
            if (!url) {
                alert('Lütfen bir YouTube linki yapıştırın!');
                return;
            }

            const videoId = extractId(url);
            
            if (!videoId) {
                alert('❌ Geçersiz link!\n\nGeçerli örnekler:\n• https://youtube.com/watch?v=VIDEO_ID\n• https://youtu.be/VIDEO_ID');
                return;
            }

            console.log('✅ Video ID:', videoId);
            addTrack(videoId);
            input.value = '';
        }

        async function pasteUrl() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('urlInput').value = text;
                
                const videoId = extractId(text);
                if (videoId) {
                    addTrack(videoId);
                }
            } catch (e) {
                alert('Panodan yapıştırılamadı. Manuel yapıştırın.');
                document.getElementById('urlInput').focus();
            }
        }

        function extractId(input) {
            // Direkt video ID
            if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
            
            // URL'den çıkar
            const patterns = [
                /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
                /youtu\.be\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
            ];
            
            for (const p of patterns) {
                const m = input.match(p);
                if (m) return m[1];
            }
            
            return null;
        }

        function addTrack(videoId) {
            // Duplicate kontrolü
            if (playlist.find(t => t.id === videoId)) {
                const idx = playlist.findIndex(t => t.id === videoId);
                currentIndex = idx;
                playTrack(playlist[idx]);
                return;
            }

            const track = {
                id: videoId,
                title: 'Yükleniyor...',
                artist: 'YouTube',
                thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
                addedAt: Date.now()
            };

            playlist.push(track);
            savePlaylist();
            updateUI();
            
            currentIndex = playlist.length - 1;
            playTrack(track);
        }

        function playTrack(track) {
            document.getElementById('status').textContent = 'Yükleniyor...';
            document.getElementById('player').style.display = 'block';
            document.getElementById('thumbnail').src = track.thumbnail;
            document.getElementById('title').textContent = track.title;
            document.getElementById('artist').textContent = track.artist;

            // Eski player'ı temizle
            destroyPlayer();
            
            // Yeni player oluştur
            const frameDiv = document.getElementById('playerFrame');
            frameDiv.innerHTML = '<div id="ytplayer"></div>';

            ytPlayer = new YT.Player('ytplayer', {
                height: '1',
                width: '1',
                videoId: track.id,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    rel: 0
                },
                events: {
                    onReady: (e) => {
                        console.log('✅ Oynatılıyor:', track.id);
                        e.target.setVolume(document.getElementById('volSlider').value);
                        e.target.playVideo();
                        document.getElementById('status').textContent = '▶️ Oynatılıyor';
                        
                        // Video bilgisini al
                        setTimeout(() => {
                            try {
                                const data = e.target.getVideoData();
                                if (data && data.title) {
                                    track.title = data.title;
                                    track.artist = data.author || 'YouTube';
                                    document.getElementById('title').textContent = track.title;
                                    document.getElementById('artist').textContent = track.artist;
                                    savePlaylist();
                                    updateUI();
                                }
                            } catch(e) {}
                        }, 1500);
                    },
                    onStateChange: (e) => {
                        if (e.data === 0) { // ENDED
                            document.getElementById('status').textContent = '⏹️ Bitti';
                            nextTrack();
                        } else if (e.data === 1) { // PLAYING
                            isPlaying = true;
                            document.getElementById('playBtn').textContent = '⏸️';
                            document.getElementById('status').textContent = '▶️ Oynatılıyor';
                        } else if (e.data === 2) { // PAUSED
                            isPlaying = false;
                            document.getElementById('playBtn').textContent = '▶️';
                            document.getElementById('status').textContent = '⏸️ Duraklatıldı';
                        }
                    },
                    onError: (e) => {
                        console.error('❌ Hata:', e.data);
                        document.getElementById('status').textContent = '❌ Hata: ' + e.data;
                        alert('Bu video çalınamadı. Embed kısıtlaması veya telif hakkı olabilir.');
                        nextTrack();
                    }
                }
            });

            updateUI();
            saveLastTrack(track);
        }

        function destroyPlayer() {
            if (ytPlayer) {
                try {
                    ytPlayer.stopVideo();
                    ytPlayer.destroy();
                } catch(e) {}
                ytPlayer = null;
            }
            document.getElementById('playerFrame').innerHTML = '';
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶️';
        }

        function togglePlay() {
            if (!ytPlayer) {
                if (currentIndex >= 0 && playlist[currentIndex]) {
                    playTrack(playlist[currentIndex]);
                }
                return;
            }

            try {
                if (isPlaying) {
                    ytPlayer.pauseVideo();
                } else {
                    ytPlayer.playVideo();
                }
            } catch(e) {
                console.error('Toggle hatası:', e);
            }
        }

        function nextTrack() {
            if (currentIndex < playlist.length - 1) {
                currentIndex++;
                playTrack(playlist[currentIndex]);
            } else {
                destroyPlayer();
                document.getElementById('player').style.display = 'none';
                document.getElementById('status').textContent = '📋 Liste sonu';
            }
        }

        function prevTrack() {
            if (currentIndex > 0) {
                currentIndex--;
                playTrack(playlist[currentIndex]);
            }
        }

        function setVolume(val) {
            if (ytPlayer && ytPlayer.setVolume) {
                ytPlayer.setVolume(val);
            }
            document.getElementById('volText').textContent = val + '%';
            localStorage.setItem('volume_v5', val);
        }

        function clearPlaylist() {
            if (playlist.length === 0) return;
            if (confirm('Listeyi temizle?')) {
                destroyPlayer();
                playlist = [];
                currentIndex = -1;
                document.getElementById('player').style.display = 'none';
                savePlaylist();
                updateUI();
            }
        }

        function updateUI() {
            const pl = document.getElementById('playlist');
            document.getElementById('count').textContent = playlist.length;
            
            if (playlist.length === 0) {
                pl.innerHTML = '<p style="text-align:center;color:#888;padding:20px">Liste boş</p>';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            pl.innerHTML = playlist.map((t, i) => `
                <div class="playlist-item${i === currentIndex ? ' active' : ''}" onclick="clickTrack(${i})">
                    <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
                        <img src="${t.thumbnail}" width="40" height="40" style="border-radius:5px" onerror="this.style.display='none'">
                        <div style="min-width:0">
                            <strong style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px">${t.title}</strong>
                            <small style="color:#aaa;font-size:11px">${t.artist}</small>
                        </div>
                    </div>
                    <button onclick="removeTrack(event, ${i})" style="width:30px;height:30px;padding:0;font-size:14px;background:none;color:#f44;border:1px solid #f44;border-radius:50%">✕</button>
                </div>
            `).join('');

            document.getElementById('prevBtn').disabled = currentIndex <= 0;
            document.getElementById('nextBtn').disabled = currentIndex >= playlist.length - 1;
        }

        function clickTrack(index) {
            currentIndex = index;
            playTrack(playlist[index]);
        }

        function removeTrack(event, index) {
            event.stopPropagation();
            
            if (currentIndex === index) {
                destroyPlayer();
                document.getElementById('player').style.display = 'none';
                currentIndex = -1;
            } else if (currentIndex > index) {
                currentIndex--;
            }
            
            playlist.splice(index, 1);
            savePlaylist();
            updateUI();
        }

        function savePlaylist() {
            localStorage.setItem('playlist_v5', JSON.stringify(playlist));
        }

        function saveLastTrack(track) {
            localStorage.setItem('last_v5', JSON.stringify({id: track.id, index: currentIndex}));
        }

        // Başlangıç
        const savedVol = localStorage.getItem('volume_v5') || 70;
        document.getElementById('volSlider').value = savedVol;
        document.getElementById('volText').textContent = savedVol + '%';

        const last = JSON.parse(localStorage.getItem('last_v5'));
        if (last && playlist.length > 0) {
            const track = playlist.find(t => t.id === last.id);
            if (track) {
                currentIndex = last.index;
                document.getElementById('player').style.display = 'block';
                document.getElementById('thumbnail').src = track.thumbnail;
                document.getElementById('title').textContent = track.title;
                document.getElementById('artist').textContent = track.artist;
                document.getElementById('status').textContent = '🔄 Son oturum';
            }
        }

        updateUI();
        console.log('✅ v5.0 hazır');
    </script>
</body>
</html>
