<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>YT Müzik v9.0</title>
    <link rel="manifest" href="manifest.json">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;padding:15px;min-height:100vh}
        .container{max-width:500px;margin:0 auto}
        
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-bottom:15px;border-bottom:1px solid #222}
        .version{background:#ff0000;color:#fff;padding:5px 12px;border-radius:15px;font-weight:bold;font-size:12px}
        .top-title{color:#888;font-size:14px}
        
        .box{background:#1a1a1a;border-radius:15px;padding:20px;margin-bottom:15px}
        
        .search-row{display:flex;gap:8px;margin-bottom:10px}
        .search-row input{flex:1;padding:14px 15px;border:2px solid #333;border-radius:25px;background:#111;color:#fff;font-size:15px;-webkit-appearance:none;min-width:0}
        .search-row input:focus{outline:none;border-color:#ff0000}
        
        button{padding:12px 20px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;font-size:14px;transition:all 0.2s}
        button:active{transform:scale(0.95)}
        
        .btn-search{background:#ff0000;color:#fff;font-size:18px;width:50px;height:50px;border-radius:50%;padding:0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
        .btn-mic{background:#333;color:#fff;font-size:18px;width:50px;height:50px;border-radius:50%;padding:0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
        .btn-mic.listening{background:#ff0000;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,0,0.4)}50%{box-shadow:0 0 0 15px rgba(255,0,0,0)}}
        
        .btn-row{display:flex;gap:8px}
        .btn-row button{flex:1}
        .btn-paste{background:#333;color:#fff}
        .btn-play{background:#ff0000;color:#fff}
        .btn-yt{background:#333;color:#fff;width:100%;margin-top:8px}
        
        .status{text-align:center;color:#ff0000;font-size:13px;margin-top:8px;min-height:20px}
        
        .player-box{display:none}
        #thumbnail{width:100%;border-radius:12px;margin-bottom:15px;max-height:250px;object-fit:cover;background:#222}
        #title{font-size:1.1em;margin-bottom:5px;word-break:break-word}
        #artist{color:#888;margin-bottom:20px}
        
        .controls{display:flex;gap:12px;justify-content:center;margin:15px 0}
        .controls button{width:55px;height:55px;border-radius:50%;background:#333;color:#fff;font-size:22px;padding:0;display:flex;align-items:center;justify-content:center}
        .controls button:disabled{opacity:0.3}
        .btn-play-main{width:75px!important;height:75px!important;font-size:30px!important;background:#ff0000!important}
        
        .volume-row{display:flex;align-items:center;gap:10px;padding:10px 15px;background:#222;border-radius:20px}
        .volume-row input[type=range]{flex:1;accent-color:#ff0000}
        
        .playlist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
        .btn-clear{background:#333;color:#fff;font-size:12px;padding:8px 15px}
        
        .playlist-item{display:flex;align-items:center;gap:10px;padding:12px;background:#222;border-radius:10px;margin:5px 0;cursor:pointer}
        .playlist-item.active{background:linear-gradient(45deg,#cc0000,#ff0000)}
        .playlist-item img{width:40px;height:40px;border-radius:6px;flex-shrink:0}
        .playlist-item .info{flex:1;min-width:0}
        .playlist-item strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .playlist-item small{color:#888;font-size:11px}
        .btn-remove{width:28px;height:28px;border-radius:50%;border:1px solid #f44;background:transparent;color:#f44;font-size:14px;padding:0;flex-shrink:0;cursor:pointer}
        
        .yt-frame{width:100%;height:400px;border:none;border-radius:10px;background:#fff;display:none}
        
        #playerFrame{position:fixed;bottom:-9999px;right:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="version">🎵 v9.0</span>
        <span class="top-title">YouTube Müzik</span>
    </div>

    <div class="container">
        <!-- ARAMA -->
        <div class="box">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Şarkı adı yazın, Enter'a basın..." autocomplete="off">
                <button onclick="searchOnYouTube()" class="btn-search" title="YouTube'da Ara">🔍</button>
                <button onclick="startVoice()" class="btn-mic" id="micBtn" title="Sesli Ara">🎤</button>
            </div>
            <div class="btn-row">
                <button onclick="pasteAndPlay()" class="btn-paste">📋 Yapıştır</button>
                <button onclick="playFromInput()" class="btn-play">▶️ Oynat</button>
            </div>
            <button onclick="toggleYTSearch()" class="btn-yt">📺 YouTube Arama Penceresi</button>
            <div id="voiceStatus" class="status"></div>
            
            <!-- Gömülü YouTube arama -->
            <iframe id="ytFrame" class="yt-frame" src=""></iframe>
        </div>

        <!-- PLAYER -->
        <div id="player" class="box player-box">
            <img id="thumbnail" src="" alt="Kapak">
            <h3 id="title">-</h3>
            <p id="artist">-</p>
            
            <div class="controls">
                <button onclick="prevTrack()" id="prevBtn" disabled>⏮️</button>
                <button onclick="togglePlay()" id="playBtn" class="btn-play-main">▶️</button>
                <button onclick="nextTrack()" id="nextBtn" disabled>⏭️</button>
            </div>
            
            <div class="volume-row">
                <span>🔈</span>
                <input type="range" id="volSlider" min="0" max="100" value="70" oninput="setVolume(this.value)">
                <span>🔊</span>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="box">
            <div class="playlist-header">
                <h3>📜 Çalma Listesi (<span id="count">0</span>)</h3>
                <button onclick="clearPlaylist()" class="btn-clear">Temizle</button>
            </div>
            <div id="playlist"></div>
        </div>
    </div>

    <div id="playerFrame"><div id="ytplayer"></div></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js?v=9.0"></script>
</body>
</html>
