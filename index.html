<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YT Müzik v10.0</title>
    <link rel="manifest" href="manifest.json">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;padding:15px;padding-bottom:120px;min-height:100vh}
        .container{max-width:500px;margin:0 auto}
        
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-bottom:20px;border-bottom:1px solid #222}
        .version{background:#ff0000;color:#fff;padding:6px 14px;border-radius:15px;font-weight:bold;font-size:12px;letter-spacing:1px}
        .top-title{color:#888;font-size:13px}
        
        .box{background:#1a1a1a;border-radius:15px;padding:18px;margin-bottom:15px;border:1px solid #222}
        
        /* GİRİŞ ALANI */
        .input-group{display:flex;gap:8px;margin-bottom:10px}
        .input-group input{flex:1;padding:14px 16px;border:2px solid #333;border-radius:25px;background:#111;color:#fff;font-size:15px;-webkit-appearance:none;min-width:0;transition:all 0.3s}
        .input-group input:focus{outline:none;border-color:#ff0000;box-shadow:0 0 15px rgba(255,0,0,0.2)}
        .input-group input::placeholder{color:#555}
        
        .btn{width:50px;height:50px;border-radius:50%;border:none;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
        .btn:active{transform:scale(0.9)}
        .btn-paste{background:#333;color:#fff}
        .btn-play{background:#ff0000;color:#fff}
        .btn-mic{background:#333;color:#fff}
        .btn-mic.listening{background:#ff0000;animation:pulse 1.2s infinite}
        
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,0,0.5)}50%{box-shadow:0 0 0 18px rgba(255,0,0,0)}}
        
        .hint{text-align:center;color:#555;font-size:12px;margin-top:8px;line-height:1.5}
        .hint code{background:#222;padding:2px 8px;border-radius:4px;color:#ff0000;font-size:11px}
        
        /* PLAYER */
        .player-box{display:none}
        #thumbnail{width:100%;border-radius:12px;margin-bottom:15px;max-height:220px;object-fit:cover;background:#222}
        #title{font-size:1.1em;margin-bottom:4px;word-break:break-word;line-height:1.3}
        #artist{color:#888;font-size:0.9em;margin-bottom:18px}
        
        .controls{display:flex;gap:10px;justify-content:center;align-items:center;margin:15px 0}
        .controls button{width:52px;height:52px;border-radius:50%;border:none;font-size:20px;cursor:pointer;background:#333;color:#fff;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
        .controls button:active{transform:scale(0.9)}
        .controls button:disabled{opacity:0.25;cursor:not-allowed}
        .btn-play-main{width:70px!important;height:70px!important;font-size:28px!important;background:#ff0000!important;box-shadow:0 0 25px rgba(255,0,0,0.4)}
        
        .volume-row{display:flex;align-items:center;gap:10px;padding:10px 15px;background:#222;border-radius:20px}
        .volume-row span{font-size:16px}
        .volume-row input[type=range]{flex:1;accent-color:#ff0000;height:4px;cursor:pointer}
        
        /* PLAYLIST */
        .playlist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .playlist-header h3{font-size:0.95em;font-weight:600}
        .btn-clear{background:transparent;color:#ff4444;border:1px solid #ff4444;padding:6px 14px;border-radius:15px;font-size:11px;cursor:pointer;transition:all 0.2s}
        .btn-clear:hover{background:#ff4444;color:#fff}
        
        .playlist-item{display:flex;align-items:center;gap:10px;padding:11px;background:#222;border-radius:10px;margin:5px 0;cursor:pointer;transition:all 0.2s;border:2px solid transparent}
        .playlist-item:active{background:#2a2a2a}
        .playlist-item.active{background:linear-gradient(135deg,#cc0000,#ff0000);border-color:#ff0000}
        .playlist-item img{width:42px;height:42px;border-radius:6px;flex-shrink:0;object-fit:cover;background:#333}
        .playlist-item .info{flex:1;min-width:0}
        .playlist-item strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
        .playlist-item small{color:#888;font-size:11px}
        .btn-remove{width:28px;height:28px;border-radius:50%;border:1px solid #f44;background:transparent;color:#f44;font-size:14px;padding:0;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
        .btn-remove:hover{background:#f44;color:#fff}
        
        #playerFrame{position:fixed;bottom:-9999px;right:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
        
        .empty-state{text-align:center;color:#555;padding:40px 20px}
        .empty-state .icon{font-size:50px;margin-bottom:15px}
        .empty-state p{font-size:14px;line-height:1.6}
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="version">🎵 v10.0</span>
        <span class="top-title">YouTube Müzik</span>
    </div>

    <div class="container">
        <!-- LİNK GİRİŞ -->
        <div class="box">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="YouTube linkini yapıştırın..." autocomplete="off" autofocus>
                <button onclick="pasteAndPlay()" class="btn btn-paste" title="Panodan Yapıştır">📋</button>
                <button onclick="playUrl()" class="btn btn-play" title="Oynat">▶️</button>
            </div>
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="veya şarkı adı yazıp Enter'a basın...">
                <button onclick="quickSearch()" class="btn btn-mic" id="micBtn" title="Sesli Ara">🎤</button>
            </div>
            <div class="hint">
                💡 <b>YouTube</b>'dan video linkini <b>kopyala</b> → <b>📋</b> tıkla → Müzik başlasın!<br>
                🎤 Mikrofonla <b>şarkı söyle</b>, YouTube'da bulalım
            </div>
        </div>

        <!-- PLAYER -->
        <div id="player" class="box player-box">
            <img id="thumbnail" src="" alt="Kapak Resmi">
            <h3 id="title">Şarkı yükleniyor...</h3>
            <p id="artist">Sanatçı</p>
            
            <div class="controls">
                <button onclick="prevTrack()" id="prevBtn" disabled title="Önceki">⏮️</button>
                <button onclick="togglePlay()" id="playBtn" class="btn-play-main" title="Oynat/Durdur">▶️</button>
                <button onclick="nextTrack()" id="nextBtn" disabled title="Sonraki">⏭️</button>
            </div>
            
            <div class="volume-row">
                <span>🔈</span>
                <input type="range" id="volSlider" min="0" max="100" value="70" oninput="setVolume(this.value)" title="Ses Seviyesi">
                <span>🔊</span>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="box">
            <div class="playlist-header">
                <h3>📜 Çalma Listesi (<span id="count">0</span>)</h3>
                <button onclick="clearPlaylist()" class="btn-clear">🗑 Temizle</button>
            </div>
            <div id="playlist">
                <div class="empty-state">
                    <div class="icon">🎵</div>
                    <p>Henüz şarkı eklenmedi</p>
                    <p style="font-size:12px;margin-top:5px">YouTube linki yapıştırarak başlayın</p>
                </div>
            </div>
        </div>
    </div>

    <div id="playerFrame"><div id="ytplayer"></div></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js?v=10.0"></script>
</body>
</html>
