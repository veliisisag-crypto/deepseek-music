<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YouTube Müzik PWA v4.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        #version-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #ff0000;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 999;
            box-shadow: 0 2px 10px rgba(255,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- VERSİYON GÖSTERGESİ -->
    <div id="version-badge">v4.0 🎵</div>

    <div class="container">
        <header>
            <h1>🎵 YouTube Müzik</h1>
            <p class="subtitle">Sadece Ses • Veri Tasarruflu • v4.0</p>
        </header>

        <div class="search-container">
            <input type="text" id="urlInput" placeholder="YouTube video linkini buraya yapıştırın...">
            <button id="playBtn">▶️ Oynat</button>
        </div>

        <div class="quick-help">
            <p>💡 <strong>Nasıl kullanılır:</strong> YouTube'dan video linkini kopyalayın, buraya yapıştırın, "Oynat"a tıklayın.</p>
        </div>

        <div class="player-container" id="playerContainer" style="display: none;">
            <div class="now-playing">
                <img id="thumbnail" src="" alt="Kapak" class="thumbnail">
                <div class="song-info">
                    <h3 id="title">Hazır</h3>
                    <p id="artist">Link yapıştırın</p>
                </div>
            </div>

            <div class="custom-controls">
                <button id="prevBtn" disabled>⏮️</button>
                <button id="playPauseBtn" class="play-btn">▶️</button>
                <button id="nextBtn" disabled>⏭️</button>
            </div>

            <div class="volume-control">
                <span>🔈</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="70">
                <span>🔊</span>
                <span id="volumeValue">70%</span>
            </div>

            <div class="status-bar">
                <span id="statusText">Hazır</span>
            </div>
        </div>

        <div class="playlist" id="playlist">
            <h3>📜 Çalma Listesi <span id="playlistCount">(0)</span></h3>
            <button id="clearPlaylist" class="clear-btn">🗑️ Listeyi Temizle</button>
            <ul id="playlistItems"></ul>
        </div>
    </div>

    <!-- YouTube Player (gizli) -->
    <div id="yt-player-container" style="position: fixed; bottom: -9999px; right: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none;">
        <div id="yt-player"></div>
    </div>

    <div class="loading" id="loading" style="display: none;">
        <div class="spinner"></div>
        <p id="loadingText">Yükleniyor...</p>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js?v=4.0"></script>
</body>
</html>
