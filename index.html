<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YT Müzik v7.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- ÜST BAR -->
    <div class="top-bar">
        <span class="version">🎵 v7.0</span>
        <span class="top-title">YouTube Müzik</span>
    </div>

    <div class="container">
        <!-- ARAMA KUTUSU -->
        <div class="search-box">
            <div class="search-row">
                <input type="text" id="urlInput" placeholder="Şarkı ara veya link yapıştır..." autocomplete="off">
                <button onclick="searchYouTube()" class="search-btn" title="YouTube'da Ara">🔍</button>
                <button onclick="startVoiceSearch()" class="mic-btn" id="micBtn" title="Sesli Ara">🎤</button>
            </div>
            <div class="action-buttons">
                <button onclick="pasteAndPlay()" class="btn-paste">📋 Yapıştır ve Oynat</button>
                <button onclick="playUrl()" class="btn-play">▶️ Oynat</button>
            </div>
            <div id="voiceStatus" class="voice-status"></div>
        </div>

        <!-- PLAYER -->
        <div id="player" class="player-box" style="display:none">
            <img id="thumbnail" src="" alt="Kapak">
            <h3 id="title">-</h3>
            <p id="artist">-</p>
            
            <div class="controls">
                <button onclick="prevTrack()" id="prevBtn" disabled>⏮️</button>
                <button onclick="togglePlay()" id="playBtn" class="play-btn">▶️</button>
                <button onclick="nextTrack()" id="nextBtn" disabled>⏭️</button>
            </div>
            
            <div class="volume-row">
                <span>🔈</span>
                <input type="range" id="volSlider" min="0" max="100" value="70" oninput="setVolume(this.value)">
                <span>🔊</span>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="playlist-box">
            <div class="playlist-header">
                <h3>📜 Çalma Listesi (<span id="count">0</span>)</h3>
                <button onclick="clearPlaylist()" class="btn-clear">Temizle</button>
            </div>
            <div id="playlist"></div>
        </div>
    </div>

    <!-- Gizli YouTube Player -->
    <div id="playerFrame"><div id="ytplayer"></div></div>
    
    <!-- Gizli audio (mikrofon için) -->
    <audio id="audioFeedback" style="display:none"></audio>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
